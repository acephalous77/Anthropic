# The RESUMPTIVE REVEAL family — "It's not X. It's Y." and kin. Corpus evidence
# (8k words of verified pre-LLM prose vs an AI-assisted draft) shows this form
# can have a ZERO base rate in a human writer while running ~1.6/1000 words in
# machine-touched text: a provenance marker, hence error level. The classical
# correlatives ("not only X but also Y") have a real human base rate and live
# in CorrelativeContrast.yml at suggestion level.
extends: existence
message: "Resumptive reveal ('%s'): the #1 AI tell, near-zero human base rate. Rewrite as a direct claim."
level: error
ignorecase: true
raw:
  - '\b(?:it|this|that)(?:[''’]s| is| was)(?:n[''’]t| not) (?:just|only|merely|simply|about)?\b[^!?\n]{0,60}\b(?:it|this|that)(?:[''’]s| is| was)\b|'
  - '\b(?:the )?(?:point|goal|question|issue|problem|answer|story|trick|difference)(?: here)? (?:is|was)n[''’]t\b[^!?\n]{0,60}\b(?:it|that)(?:[''’]s| is| was)\b|'
  - '\b(?:is|are|was|were)(?:n[''’]t| not| never)\b[^!?\n]{0,60}(?:—|–|;|\.|,) ?[''"’”]?(?:it|they)(?:[''’]s| is| are| was)\b|'
  - '\bnot so much\b[^.!?\n]{0,50}\b(?:as|but)\b|'
  - '\bless about\b[^.!?\n]{0,40}\b(?:than|and more) about\b|'
  - '\b(?:is|are|was|were)(?:n[''’]t| not)? more than (?:just|merely) (?:a |an |the )?\w+|'
  - ', not (?:a |an |the )?\w+(?: \w+)?[.;]|'
  - '\bno \w+(?: \w+)?\. no \w+(?: \w+)?\.|'
  - '\brather than \w+(?:ing)?[^.!?\n]{0,40}, (?:it|this|that|we|the)\b'
